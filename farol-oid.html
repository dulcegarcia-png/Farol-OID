<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farol OID – casos do Operational Intelligence Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --brand: #820ad1;
  --brand-ink: #ffffff;
  --bg: #f6f2fa;
  --surface: #ffffff;
  --ink: #1f1229;
  --ink-soft: #5f5470;
  --line: #e0d6ea;
  --accent: #820ad1;
  --accent-ink: #ffffff;
  --accent-wash: #f0e3fb;
  --ok: #1d7a4d;
  --ok-wash: #e0f3e8;
  --wip: #8a5a00;
  --wip-wash: #f8ecd0;
  --todo: #5f5470;
  --todo-wash: #ece6f2;
  --focus: #5e0897;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand: #3a0f63;
    --brand-ink: #ffffff;
    --bg: #140a1e;
    --surface: #1f1230;
    --ink: #f1e9f8;
    --ink-soft: #b5a6c6;
    --line: #3a2852;
    --accent: #b96df6;
    --accent-ink: #140a1e;
    --accent-wash: #33194d;
    --ok: #7fd1a0;
    --ok-wash: #1b3327;
    --wip: #e9c26a;
    --wip-wash: #3a2f14;
    --todo: #bfb0d0;
    --todo-wash: #2d1f42;
    --focus: #d3a6ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #3a0f63;
  --brand-ink: #ffffff;
  --bg: #140a1e;
  --surface: #1f1230;
  --ink: #f1e9f8;
  --ink-soft: #b5a6c6;
  --line: #3a2852;
  --accent: #b96df6;
  --accent-ink: #140a1e;
  --accent-wash: #33194d;
  --ok: #7fd1a0;
  --ok-wash: #1b3327;
  --wip: #e9c26a;
  --wip-wash: #3a2f14;
  --todo: #bfb0d0;
  --todo-wash: #2d1f42;
  --focus: #d3a6ff;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

.band { background: var(--brand); color: var(--brand-ink); }
.band-in { max-width: 1040px; margin: 0 auto; padding: 22px 20px 26px; position: relative; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 20px 64px; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; color: var(--brand-ink); }
header p { margin: 0; color: rgba(255,255,255,0.88); max-width: 62ch; }
.snapshot { margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.8); }
header { padding-right: 0; }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.btn-band {
  appearance: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.55);
  background: transparent; color: var(--brand-ink); font: inherit; font-size: 14px; font-weight: 600;
  padding: 7px 16px; border-radius: 999px; cursor: pointer;
}
.btn-band:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
.btn-band:disabled { opacity: 0.6; cursor: default; }
.btn-band[hidden] { display: none; }
.btn-band svg { width: 18px; height: 18px; flex: none; }
.icon-btn { width: 40px; height: 40px; padding: 0; justify-content: center; }
.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }
.status { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); max-width: 80ch; }
.status:empty { display: none; }
.status.err { color: var(--wip); background: var(--wip-wash); padding: 8px 12px; border-radius: 6px; }
.brand { display: flex; align-items: center; gap: 20px; }
.brand-text { min-width: 0; }
.brand h1 { font-size: 36px; letter-spacing: -0.02em; margin: 0 0 6px; }
.logo { width: 92px; height: 92px; flex: none; }
.logo .beam { fill: #ffe27a; opacity: 0.4; animation: sweep 3.4s ease-in-out infinite; }
.logo .beam:nth-of-type(2) { animation-delay: 1.7s; }
@keyframes sweep { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .logo .beam { animation: none; } }
@media (max-width: 520px) { .logo { width: 68px; height: 68px; } .brand h1 { font-size: 28px; } .brand { gap: 14px; } }
.act-left { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-solid, .btn-ghost { appearance: none; font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.btn-solid { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn-ghost { border: 1px solid var(--accent); background: transparent; color: var(--accent); }
.btn-solid:disabled, .btn-ghost:disabled { opacity: 0.5; cursor: default; }
.plan-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.plan-h { font-size: 20px; margin: 28px 0 6px; font-weight: 700; }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 16px; margin-top: 12px; }
.plan-card h3 { font-size: 16px; margin: 0; }
.plan-card h4 { font-size: 13px; margin: 14px 0 4px; font-weight: 700; color: var(--ink-soft); }
.plan-card p { margin: 6px 0; }
.plan-card ul { margin: 4px 0 6px; padding-left: 20px; }
.plan-card li { margin: 3px 0; }
.plan-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.plan-sub { color: var(--ink-soft); font-size: 14px; }
.plan-tickets { font-size: 14px; font-weight: 500; }
.plan-resp { font-size: 13px; color: var(--ink-soft); }
.plan-inline { margin-top: 16px; padding-top: 4px; border-top: 1px dashed var(--line); }
.plan-inline h3 { font-size: 14px; margin: 14px 0 6px; font-weight: 700; }
.plan-inline h4 { font-size: 13px; margin: 12px 0 4px; font-weight: 700; color: var(--ink-soft); }
.plan-inline ul { margin: 4px 0 6px; padding-left: 20px; }
.chip.alta { background: var(--wip-wash); color: var(--wip); }
.chip.media { background: var(--accent-wash); color: var(--accent); }
.chip.baixa { background: var(--todo-wash); color: var(--todo); }
.period { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.period select { padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 210px; }
.band :focus-visible { outline-color: #ffffff; }
.wrap { padding-bottom: 96px; }
#assistant {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  display: flex; flex-direction: column; align-items: flex-end; gap: 12px; max-width: calc(100vw - 32px);
}
#assistant[hidden] { display: none; }
.chat-fab {
  appearance: none; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 14px; font-weight: 600;
  padding: 12px 18px; cursor: pointer; box-shadow: 0 6px 20px rgba(60,10,100,0.35);
}
.chat-fab svg { width: 20px; height: 20px; flex: none; }
.chat {
  width: 380px; max-width: calc(100vw - 32px); height: min(560px, calc(100vh - 120px));
  display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 12px 36px rgba(40,10,70,0.35); overflow: hidden;
}
.chat[hidden] { display: none; }
.chat-head { display: flex; justify-content: space-between; align-items: center; background: var(--brand); color: var(--brand-ink); padding: 12px 14px; }
.chat-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.chat-title svg { width: 20px; height: 20px; }
.chat-close { appearance: none; border: 0; background: transparent; color: var(--brand-ink); font-size: 22px; line-height: 1; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
.chat-close:hover { background: rgba(255,255,255,0.16); }
.chat-head :focus-visible { outline-color: #ffffff; }
.chat-log { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.msg .txt { white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.bot { align-self: flex-start; background: var(--accent-wash); color: var(--ink); }
.msg.err { background: var(--wip-wash); color: var(--wip); }
.msg-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.msg-links button { appearance: none; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; padding: 3px 10px; cursor: pointer; }
.chat-sugg { padding: 6px 12px; border-top: 1px solid var(--line); }
.chat-sugg[hidden] { display: none; }
.link-btn { appearance: none; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; padding: 4px 2px; cursor: pointer; text-decoration: underline; }
.row .msg.wide { width: calc(100% - 36px); }
.sugg-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.sugg-btn { appearance: none; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; font: inherit; font-size: 13px; line-height: 1.35; padding: 9px 12px; cursor: pointer; }
.sugg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.sugg-btn:disabled, .link-btn:disabled, .chat-send:disabled, .chat-form input:disabled { opacity: 0.55; cursor: default; }
.chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.chat-form input::placeholder { color: var(--ink-soft); }
.chat-send { appearance: none; width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.chat-send svg { width: 18px; height: 18px; }
.mascot { display: block; flex: none; border-radius: 50%; }
.chat-title .mascot { width: 38px; height: 38px; box-shadow: 0 0 0 2px rgba(255,255,255,0.7); }
.chat-title small { display: block; font-weight: 500; font-size: 12px; opacity: 0.85; margin-top: 1px; }
.chat-fab { padding: 6px 18px 6px 8px; }
.chat-fab .mascot { width: 36px; height: 36px; box-shadow: 0 0 0 2px rgba(255,255,255,0.75); }
.row { display: flex; gap: 8px; align-items: flex-start; align-self: flex-start; max-width: 100%; }
.row .mascot { width: 28px; height: 28px; margin-top: 2px; }
.row .msg { max-width: calc(100% - 36px); }
@media (max-width: 520px) { .chat { width: calc(100vw - 32px); height: calc(100vh - 110px); } }

.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 24px 0 0; }
.search { flex: 1 1 280px; position: relative; }
.search input {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.search input::placeholder { color: var(--ink-soft); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 18px; overflow-x: auto; }
.tab {
  appearance: none; background: none; border: 0; font: inherit; color: var(--ink-soft);
  padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px;
  white-space: nowrap; font-weight: 500;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count {
  display: inline-block; min-width: 22px; text-align: center; margin-left: 6px; padding: 0 6px;
  border-radius: 999px; background: var(--todo-wash); color: var(--ink-soft); font-size: 12px; font-weight: 600;
}
.tab[aria-selected="true"] .count { background: var(--accent-wash); color: var(--accent); }

.hint { font-size: 13px; color: var(--ink-soft); margin: 14px 0 0; max-width: 70ch; }

.list { margin-top: 12px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
.case-head {
  width: 100%; appearance: none; background: none; border: 0; font: inherit; color: inherit; text-align: left;
  display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 16px; cursor: pointer; align-items: start;
}
.case-title { font-weight: 600; }
.case-meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-wash); color: var(--ok); }
.chip.wip { background: var(--wip-wash); color: var(--wip); }
.chip.todo { background: var(--todo-wash); color: var(--todo); }
.case-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--line); }
.case.open .case-body { display: block; }
.links { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0 4px; font-weight: 500; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 10px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.cols h3, .resp h3 { font-size: 14px; margin: 14px 0 6px; font-weight: 700; }
.cols p { margin: 0 0 8px; }
.steps { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.steps li { position: relative; padding: 0 0 12px 16px; }
.steps li::before {
  content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--surface);
}
.steps .when { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.pending { color: var(--ink-soft); font-style: italic; }

.resp-item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; padding: 16px 18px 18px; }
.resp-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.resp-top .who { font-size: 13px; color: var(--ink-soft); }
.resp h2 { font-size: 16px; margin: 0; }
.resp-text { font-family: "Newsreader", Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.55; max-width: 72ch; }
.resp-text p { margin: 8px 0; }
.resp-text ul { margin: 4px 0 8px; padding-left: 20px; }
.resp-text .lbl { font-family: "Public Sans", system-ui, sans-serif; font-size: 13px; font-weight: 700; display: block; margin-top: 12px; color: var(--ink-soft); }
.note { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
.empty { color: var(--ink-soft); padding: 28px 4px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.filters button {
  appearance: none; font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
mark { background: var(--wip-wash); color: inherit; padding: 0 1px; border-radius: 2px; }
</style>
</head>
<body>
<div class="band"><div class="band-in">
  <div class="actions">
    <div class="act-left">
      <button type="button" class="btn-band" id="refresh"><span id="refresh-label">Atualizar</span></button>
      <button type="button" class="btn-band" id="stop" hidden>Parar</button>
      <button type="button" class="btn-band" id="plan-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM8 6H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-2M9 13l2 2 4-4"/></svg><span>Plano de ação</span></button>
    </div>
    <button type="button" class="btn-band icon-btn" id="theme-toggle" aria-label="Mudar para tela escura"></button>
  </div>
  <header class="brand">
    <svg class="logo" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
      <polygon class="beam" points="48,28 2,8 2,44"/>
      <polygon class="beam" points="48,28 94,8 94,44"/>
      <circle cx="12" cy="62" r="1.6" fill="#ffffff" opacity="0.8"/>
      <circle cx="84" cy="56" r="1.4" fill="#ffffff" opacity="0.7"/>
      <circle cx="70" cy="70" r="1.2" fill="#ffffff" opacity="0.6"/>
      <path d="M0 88 Q12 80 24 86 T48 86 T72 86 T96 84 V96 H0 Z" fill="#c79bf2" opacity="0.55"/>
      <path d="M37 90 L41.5 38 L54.5 38 L59 90 Z" fill="#ffffff"/>
      <path d="M40.4 60 L55.6 60 L56.7 72 L39.3 72 Z" fill="#c79bf2"/>
      <path d="M39.1 74 L56.9 74 L57.6 82 L38.4 82 Z" fill="#c79bf2" opacity="0"/>
      <rect x="34" y="35" width="28" height="4" rx="1.5" fill="#e9d5fb"/>
      <rect x="41" y="25" width="14" height="10" rx="1.5" fill="#ffd54a"/>
      <path d="M48 25 V35 M44.5 25 V35 M51.5 25 V35" stroke="#a86a00" stroke-width="0.8" opacity="0.55"/>
      <path d="M39.5 25 L48 16 L56.5 25 Z" fill="#e9d5fb"/>
      <circle cx="48" cy="14.6" r="1.8" fill="#ffffff"/>
      <rect x="45.4" y="78" width="5.2" height="12" rx="2.6" fill="#820ad1"/>
      <path d="M0 91 Q12 85 24 90 T48 90 T72 90 T96 88 V96 H0 Z" fill="#b96df6" opacity="0.8"/>
    </svg>
    <div class="brand-text">
      <h1>Farol OID</h1>
      <p>Todos os casos do #operational-intelligence-desk num só lugar: ticket, passo a passo e resposta enviada.</p>
      <p class="snapshot" id="snap">Dados de 23/11/2026</p>
    </div>
  </header>
</div></div>
<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <input id="q" type="search" placeholder="Buscar por JOI, processo, palavra-chave…" aria-label="Buscar casos">
    </div>
    <label class="period"><span>Mês de abertura</span><select id="month" aria-label="Filtrar por mês de abertura"><option value="">Todos os meses</option></select></label>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="hint" id="hint"></p>
  <div id="panel" role="tabpanel"></div>
</div>

<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
  <defs><clipPath id="mclip"><circle cx="32" cy="32" r="32"/></clipPath></defs>
  <symbol id="mascot" viewBox="0 0 64 64">
    <g clip-path="url(#mclip)">
      <circle cx="32" cy="32" r="32" fill="#f0e3fb"/>
      <path d="M6 66 Q8 46 32 46 Q56 46 58 66 Z" fill="#5e0897"/>
      <rect x="28" y="40" width="8" height="9" rx="2" fill="#e8b186"/>
      <path d="M23 46 L32 56 L41 46 Z" fill="#ffffff"/>
      <path d="M29.5 47 L32 50 L34.5 47 Z" fill="#820ad1"/>
      <circle cx="20" cy="31" r="2.6" fill="#f6c9a0"/>
      <circle cx="44" cy="31" r="2.6" fill="#f6c9a0"/>
      <ellipse cx="32" cy="30" rx="12" ry="13" fill="#f6c9a0"/>
      <path d="M19 26 Q15 30 17 37 Q20.5 35 21.5 28 Z" fill="#820ad1" stroke="#5e0897" stroke-width="0.8"/>
      <path d="M45 26 Q49 30 47 37 Q43.5 35 42.5 28 Z" fill="#820ad1" stroke="#5e0897" stroke-width="0.8"/>
      <path d="M19 26 Q19 8 32 8 Q45 8 45 26 Q38 22 32 22 Q26 22 19 26 Z" fill="#820ad1"/>
      <path d="M26 10 Q25 17 25.5 22.5 M32 8 V22 M38 10 Q39 17 38.5 22.5 M20.5 17 Q32 13.5 43.5 17" stroke="#b96df6" stroke-width="0.9" fill="none" opacity="0.75"/>
      <path d="M18.4 26.5 Q32 31 45.6 26.5 Q46 23.6 44 23 Q32 26 20 23 Q18 23.6 18.4 26.5 Z" fill="#5e0897"/>
      <circle cx="32" cy="7.6" r="2.2" fill="#5e0897"/>
      <circle cx="27.5" cy="31.5" r="1.7" fill="#1f1229"/>

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function hl(s, q) {
  var t = esc(s);
  if (!q) return t;
  var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return t.replace(re, "<mark>$1</mark>");
}
function blob(c) {
  var parts = [c.id, c.team, c.title, c.owner, c.stateLabel];
  (c.ticket || []).forEach(function (x) { parts.push(x); });
  (c.steps || []).forEach(function (s) { parts.push(s.text); });
  if (c.response) {
    var r = c.response;
    parts.push(r.title, r.resumo, r.desfecho || '', r.envio || '');
    (r.boas || []).forEach(function (x) { parts.push(x); });
    (r.gaps || []).concat(r.riscos || []).forEach(function (x) { parts.push(x); });
  }
  var od = openDate(c);
  if (od) parts.push(pad2(od.getDate()) + "/" + pad2(od.getMonth() + 1) + "/" + od.getFullYear(), od.getFullYear() + "-" + pad2(od.getMonth() + 1) + "-" + pad2(od.getDate()));
  parts.push(c.prazo || "");
  var pm = String(c.prazo || "").match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (pm) parts.push(pm[3] + "-" + pm[2] + "-" + pm[1]);
  (c.steps || []).forEach(function (s) { parts.push(s.when); });
  if (c.plano) { parts.push(c.plano.causa, c.plano.acoes.join(" "), c.plano.prevencao.join(" ")); }
  return parts.join(" ").toLowerCase();
}
function openDate(c) {
  var s = String(c.slack || "");
  if (!/^\d{16}$/.test(s)) return null;
  return new Date(parseInt(s.slice(0, 10), 10) * 1000);
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function monthKey(c) { var d = openDate(c); return d ? d.getFullYear() + "-" + pad2(d.getMonth() + 1) : ""; }
function monthLabel(k) {
  var p = k.split("-");
  var t = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function openedSpan(c) {
  var d = openDate(c);
  return d ? "<span>Aberto em " + pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() + "</span>" : "";
}
function curMonth() { var el = document.getElementById("month"); return el ? el.value : ""; }
var monthSig = "";
function fillMonths() {
  var el = document.getElementById("month");
  if (!el) return;
  var cnt = {};
  CASES.forEach(function (c) { var k = monthKey(c); if (k) cnt[k] = (cnt[k] || 0) + 1; });
  var keys = Object.keys(cnt).sort().reverse();
  var sg = keys.map(function (k) { return k + ":" + cnt[k]; }).join("|");
  if (sg === monthSig) return;
  var cur = el.value; monthSig = sg;
  el.innerHTML = '<option value="">Todos os meses</option>' + keys.map(function (k) {
    return '<option value="' + k + '">' + esc(monthLabel(k)) + " (" + cnt[k] + ")</option>";
  }).join("");
  el.value = keys.indexOf(cur) >= 0 ? cur : "";
}
function matches(c, q) {
  var m = curMonth();
  if (m && monthKey(c) !== m) return false;
  if (!q) return true;
  var qq = q.toLowerCase().replace(/^(\d{1,2})[-.](\d{1,2})(?:[-.](\d{2,4}))?$/, function (_, d, mo, y) { return d + "/" + mo + (y ? "/" + y : ""); });
  return blob(c).indexOf(qq) !== -1;
}

function renderTabs(q) {
  var el = document.getElementById("tabs");
  var html = "";
  TEAMS.forEach(function (t) {
    var n = CASES.filter(function (c) { return c.team === t && matches(c, q); }).length;
    html += '<button class="tab" role="tab" data-tab="' + t + '" aria-selected="' + (active === t) + '">' + t + '<span class="count">' + n + "</span></button>";
  });
  var rn = CASES.filter(function (c) { return c.response && matches(c, q); }).length;
  html += '<button class="tab" role="tab" data-tab="' + RESP + '" aria-selected="' + (active === RESP) + '">' + RESP + '<span class="count">' + rn + "</span></button>";
  var pn = CASES.filter(function (c) { return c.plano; }).length;
  html += '<button class="tab" role="tab" data-tab="' + PLAN + '" aria-selected="' + (active === PLAN) + '">' + PLAN + '<span class="count">' + pn + "</span></button>";
  el.innerHTML = html;
}

function caseHtml(c, q) {
  var isOpen = !!open[c.id] || (q && c.full);
  var h = '<div class="case' + (isOpen ? " open" : "") + '" data-id="' + c.id + '">';
  h += '<button class="case-head" aria-expanded="' + isOpen + '" data-toggle="' + c.id + '">';
  h += '<div><div class="case-title">' + hl(c.id, q) + " · " + hl(c.title, q) + "</div>";
  h += '<div class="case-meta"><span>Prazo ' + esc(c.prazo) + "</span>" + openedSpan(c) + "<span>" + hl(c.owner, q) + "</span></div></div>";
  h += '<span class="chip ' + c.state + '">' + esc(c.stateLabel) + "</span></button>";
  h += '<div class="case-body">';
  h += '<div class="links"><a href="' + JIRA + c.id + '" target="_blank" rel="noopener">Abrir ticket no Jira</a><a href="' + SLACK + c.slack + '" target="_blank" rel="noopener">Abrir thread no Slack</a></div>';
  if (c.full) {
    h += '<div class="cols"><div><h3>O que o analista registrou no ticket</h3>';
    c.ticket.forEach(function (p) { h += "<p>" + hl(p, q) + "</p>"; });
    h += '</div><div><h3>Passo a passo</h3><ol class="steps">';
    c.steps.forEach(function (s) { h += '<li><span class="when">' + esc(s.when) + "</span>" + hl(s.text, q) + "</li>"; });
    h += "</ol></div></div>";
    if (!c.response) h += '<p class="note">Ainda sem resposta enviada: o caso segue em andamento.</p>';
    if (c.plano) h += planInline(c.plano);
  } else {
    h += '<p class="pending">O resumo do ticket, o passo a passo e a resposta deste caso serão gerados na próxima atualização. Clique em Atualizar no topo da página. A classificação por time também é confirmada nessa leitura.</p>';
  }
  h += "</div></div>";
  return h;
}

function listHtml(arr) {
  if (!arr || !arr.length) return "";
  return "<ul>" + arr.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
}

function respHtml(c) {
  var r = c.response;
  var h = '<article class="resp-item resp"><div class="resp-top"><h2>' + esc(c.id) + " · " + esc(c.team) + '</h2><span class="who">' + esc(r.by) + "</span></div>";
  h += '<div class="resp-text"><p><strong>' + esc(r.title) + "</strong></p>";
  h += '<span class="lbl">Resumo</span><p>' + esc(r.resumo) + "</p>";
  h += '<span class="lbl">Gaps mapeados</span>' + listHtml(r.gaps);
  h += '<span class="lbl">Riscos mapeados</span>' + listHtml(r.riscos);
  if (r.desfecho) h += '<span class="lbl">Desfecho</span><p>' + esc(r.desfecho) + "</p>";
  if (r.boas) h += '<span class="lbl">Boas práticas</span>' + listHtml(r.boas);
  if (r.envio) h += '<span class="lbl">Envio da resposta</span><p>' + esc(r.envio) + "</p>";
  h += "</div>";
  h += '<div class="links"><a href="' + JIRA + c.id + '" target="_blank" rel="noopener">Ticket no Jira</a><a href="' + SLACK + c.slack + '" target="_blank" rel="noopener">Thread no Slack</a>';
  if (r.extra && /^https:\/\//.test(r.extra.url)) h += '<a href="' + esc(r.extra.url) + '" target="_blank" rel="noopener">' + esc(r.extra.label) + "</a>";
  h += "</div></article>";
  return h;
}

function render() {
  fillMonths();
  var q = document.getElementById("q").value.trim();
  renderTabs(q);
  var mSel = curMonth();
  document.getElementById("hint").textContent = HINTS[active] + (mSel ? " Mostrando só casos abertos em " + monthLabel(mSel) + "." : "");
  var p = document.getElementById("panel");
  var h = "";
  if (active === PLAN) { p.innerHTML = planView(q); return; }
  if (active === RESP) {
    h += '<div class="filters" id="filters">';
    ["Todos"].concat(TEAMS).forEach(function (t) {
      h += '<button data-filter="' + t + '" aria-pressed="' + (respFilter === t) + '">' + t + "</button>";
    });
    h += "</div>";
    var rows = CASES.filter(function (c) { return c.response && matches(c, q) && (respFilter === "Todos" || c.team === respFilter); }).sort(function (a, b) { return num(b.id) - num(a.id); });
    if (!rows.length) h += '<p class="empty">Nenhuma resposta encontrada para esse filtro.</p>';
    rows.forEach(function (c) { h += respHtml(c); });
  } else {
    var items = CASES.filter(function (c) { return c.team === active && matches(c, q); }).sort(function (a, b) { return num(b.id) - num(a.id); });
    h += '<div class="list">';
    if (!items.length) h += '<p class="empty">Nenhum caso encontrado nesta aba.</p>';
    items.forEach(function (c) { h += caseHtml(c, q); });
    h += "</div>";
  }
  p.innerHTML = h;
}

});

var MAX_PER_CLICK = 40;
async function refresh() {
  if (busy || !mcp || !db) return;
  if (!sample) { setStatus("O resumo automático precisa do Claude, que não está disponível nesta página.", "err"); return; }
  busy = true; stopRequested = false; paintRefresh(true);
  var gotLease = false;
  try {
    var lease = await db.doc("meta/lock").acquire({ holder: tabId, ttlMs: 300000 });
    if (!lease.acquired) {
      setStatus("Outra pessoa está atualizando agora. Os casos aparecem aqui assim que ficarem prontos.");
      return;
    }
    gotLease = true;
    var found = await readWholeChannel();

    var items = found.map(function (f) {
      return { id: f.id, ts: f.ts, title: f.title, kind: f.kind, team: f.team, prazo: f.prazo, replies: f.replies };
    });

      INDEX = items.map(cleanItem).filter(Boolean); INDEX_SIG = sig(INDEX); rebuild();
      setStatus("Registrando " + INDEX.length + " casos do canal para todos…");
      await db.doc("meta/index").set({ items: INDEX, at: Date.now() });
    }

    var todo = [], queued = {};

      var c = known[f.id];

    });

      if (c.state !== "ok" && c.slack) queue(c.id, dotTs(c.slack), c.prazo, c.replies);
    });

    if (!todo.length) {
      await db.doc("meta/sync").set({ at: Date.now() });
      setStatus("Tudo em dia: " + CASES.length + " casos no Farol e nenhum pendente de leitura.");
      return;

      var got = await Promise.all([
        call(JIRA_SRV, "getJiraIssue", { cloudId: CLOUD, issueIdOrKey: t.id, fields: ["summary", "description", "status", "labels", "assignee", "reporter", "created", "comment"], responseContentFormat: "markdown" }),
        call(SLACK_SRV, "slack_read_thread", { channel_id: CHANNEL, message_ts: t.ts, limit: 200 })
      ]);
      var jira = jiraBrief(got[0]);
      setStatus("Resumindo " + t.id + " (" + (i + 1) + " de " + run.length + "). Pode levar um minuto…");
      var raw = await sample.json(buildPrompt(t.id, t.prazo, jira, asText(got[1])), { modelTier: "default" });
      if (!raw || typeof raw !== "object") throw { code: "bad_request", message: "resposta inválida do resumo" };
      raw.prazo = t.prazo || (base && base.prazo) || "—";
      raw.jiraStatus = jira.status || "—";
      raw.slack = (base && base.slack) || undotTs(t.ts);
      raw.replies = typeof t.replies === "number" ? t.replies : (base && base.replies);
      var c = cleanCase(t.id, raw);
      if (!c) throw { code: "bad_request", message: "caso inválido" };
      await db.doc("cases/" + c.id).set(toDoc(c));

    setStatus((stopRequested ? "Parado. " : "Atualizado para todos. ") + done + (done === 1 ? " caso lido e resumido." : " casos lidos e resumidos.") +
      (left > 0 ? " Faltam " + left + " para ler. Clique em Atualizar para continuar de onde parou." : " Nenhum caso pendente."));

}

    '<button type="button" class="btn-ghost" data-act="gen-plan"' + (off || !allWithPlan ? " disabled" : "") + ">Atualizar plano consolidado</button></div>";
  if (!canWrite) h += '<p class="note">Seu acesso é de leitura: você vê os planos, mas não gera novos.</p>';

  h += '<h2 class="plan-h">Ações para evitar que se repitam</h2>';
  if (PLAN_DOC && PLAN_DOC.temas.length) {
    var when = PLAN_DOC.at ? new Date(PLAN_DOC.at).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
    h += '<p class="note">' + (when ? "Gerado em " + esc(when) : "Plano consolidado") + (PLAN_DOC.n ? ", com base em " + PLAN_DOC.n + " casos lidos" : "") + ".</p>";
    PLAN_DOC.temas.forEach(function (t) {
      h += '<article class="plan-card"><div class="plan-top"><h3>' + esc(t.tema) + '</h3><span class="chip ' + priClass(t.prioridade) + '">Prioridade ' + esc(t.prioridade) + "</span></div>";
      if (t.problema) h += '<p class="plan-sub">' + esc(t.problema) + "</p>";
      if (t.casos.length) h += '<p class="plan-tickets">Tickets: ' + t.casos.map(ticketLink).join(", ") + "</p>";
      if (t.acoes.length) h += "<h4>O que fazer</h4>" + listHtml(t.acoes);
      if (t.prevencao.length) h += "<h4>Como evitar que se repita</h4>" + listHtml(t.prevencao);
      if (t.responsavel) h += '<p class="plan-resp">Responsável sugerido: ' + esc(t.responsavel) + "</p>";
      h += "</article>";
    });
  } else {
    h += '<p class="empty">Ainda não há plano consolidado. Clique em “Atualizar plano consolidado” para agrupar os casos em temas.</p>';
  }

  h += '<h2 class="plan-h">Plano por caso</h2>';
  if (!withPlan.length) h += '<p class="empty">Nenhum plano encontrado para esta busca.</p>';
  withPlan.forEach(function (c) {
    h += '<article class="plan-card"><div class="plan-top"><h3>' + ticketLink(c.id) + " · " + esc(c.title) + '</h3><span class="chip ' + c.state + '">' + esc(c.stateLabel) + "</span></div>";
    h += '<p class="plan-sub">' + esc(c.team) + (c.prazo && c.prazo !== "—" ? " · prazo " + esc(c.prazo) : "") + "</p>";
    var pl = c.plano;
    if (pl.causa) h += "<p><strong>Causa provável:</strong> " + esc(pl.causa) + "</p>";
    if (pl.acoes.length) h += "<h4>O que fazer</h4>" + listHtml(pl.acoes);
    if (pl.prevencao.length) h += "<h4>Como evitar que se repita</h4>" + listHtml(pl.prevencao);
    if (pl.indicador) h += '<p class="note">Como acompanhar: ' + esc(pl.indicador) + "</p>";
    h += '<div class="links"><button type="button" class="link-btn" data-goto="' + esc(c.id) + '">Abrir o caso completo</button></div></article>';
  });
  return h;
}

function planPrompt(c) {
  var r = c.response;
  var data = {
    id: c.id, time: c.team, titulo: c.title, situacao: c.stateLabel, prazo: c.prazo,
    ticket: clip((c.ticket || []).join(" "), 900),
    passoAPasso: (c.steps || []).slice(-10).map(function (s) { return s.when + ": " + clip(s.text, 170); }),
    resposta: r ? { resumo: clip(r.resumo, 600), gaps: r.gaps, riscos: r.riscos, desfecho: clip(r.desfecho || "", 240), envio: clip(r.envio || "", 200) } : null
  };
  return "Você ajuda a equipe do OID (Operational Intelligence Desk) a tratar casos jurídicos e a evitar que casos iguais aconteçam de novo. " +
    "Responda SOMENTE com um objeto JSON válido, sem texto antes ou depois e sem crases.\n\n" +
    "REGRAS\n" +
    "- Português do Brasil, texto simples, frases curtas e práticas, específicas para este caso.\n" +
    "- acoes: 3 a 5 ações para tratar o caso. Cada uma diz o que fazer, cita o ticket (" + c.id + ") e termina com \"Responsável sugerido: X\" (OOS, Simba, LW Suits, Legal, Strategic Defense, Qualidade, Produto, Engenharia ou Operação).\n" +
    "- prevencao: 3 a 4 medidas para evitar que outros casos iguais aconteçam (processo, checklist, treinamento, alerta, macro, ferramenta), cada uma com \"Responsável sugerido: X\".\n" +
    "- causa: a causa provável em 1 ou 2 frases, com base só nos dados abaixo. Se não houve falha, diga isso e proponha acompanhamento e boas práticas.\n" +
    "- indicador: uma frase dizendo como acompanhar se a prevenção funciona.\n" +
    "- Não invente fatos além dos dados. Não inclua CPF, CNPJ de pessoa física nem número de conta.\n\n" +
    "FORMATO\n{\"causa\":\"\",\"acoes\":[\"\"],\"prevencao\":[\"\"],\"indicador\":\"\"}\n\n" +
    "CASO (JSON):\n" + clip(JSON.stringify(data), 14000);
}

async function runJob(worker) {
  if (busy || !sample || !db || !canWrite) return;
  busy = true; stopRequested = false; paintRefresh(true);
  var got = false;
  try {
    var lease = await db.doc("meta/lock").acquire({ holder: tabId, ttlMs: 300000 });
    if (!lease.acquired) {
      setStatus("Outra pessoa está atualizando agora. Os resultados aparecem aqui assim que ficarem prontos.");
      return;
    }
    got = true;
    await worker();
  } catch (e) {
    setStatus(errMessage(e), "err");
  } finally {
    if (got) { try { await db.doc("meta/lock").acquire({ holder: tabId, ttlMs: 1000 }); } catch (e2) {} }
    busy = false; stopRequested = false; paintRefresh(false);
  }
}
function genMissing() {
  return runJob(async function () {
    var list = CASES.filter(function (c) { return c.full && !c.plano; }).sort(byNum).slice(0, 30), done = 0;
    for (var i = 0; i < list.length; i++) {
      if (stopRequested) break;
      var c = list[i];
      setStatus("Gerando o plano de ação de " + c.id + " (" + (i + 1) + " de " + list.length + ")…");
      var raw = await sample.json(planPrompt(c), { modelTier: "default" });
      var pl = cleanPlan(raw && raw.plano ? raw.plano : raw);
      if (!pl) throw { code: "bad_request", message: "plano inválido" };
      var nc = toDoc(c); nc.plano = pl;
      await db.doc("cases/" + c.id).set(nc);
      await db.doc("meta/lock").acquire({ holder: tabId, ttlMs: 300000 });
      done++;
    }
    var left = CASES.filter(function (c) { return c.full && !c.plano; }).length;
    setStatus((stopRequested ? "Parado. " : "Pronto para todos. ") + done + (done === 1 ? " plano gerado." : " planos gerados.") +
      (left > 0 ? " Faltam " + left + ". Clique de novo para continuar." : ""));
  });
}
function genConsolidated() {
  return runJob(async function () {
    var src = CASES.filter(function (c) { return c.plano || c.response; }).sort(byNum).map(function (c) {
      var r = c.response, p = c.plano;
      return {
        id: c.id, time: c.team, titulo: clip(c.title, 120),
        gaps: r ? (r.gaps || []).slice(0, 3).map(function (g) { return clip(g, 140); }) : [],
        riscos: r ? (r.riscos || []).slice(0, 2).map(function (g) { return clip(g, 120); }) : [],
        causa: p ? clip(p.causa, 220) : "",
        prevencao: p ? p.prevencao.slice(0, 2).map(function (g) { return clip(g, 160); }) : []
      };
    });
    if (!src.length) throw { code: "bad_request", message: "sem casos" };
    setStatus("Agrupando " + src.length + " casos em temas e montando o plano consolidado. Pode levar alguns minutos…");
    var prompt = "Você ajuda a equipe do OID (Operational Intelligence Desk) a evitar que casos jurídicos se repitam. " +
      "Com base nos casos abaixo, agrupe os problemas em no máximo 8 temas recorrentes e proponha um plano de ação por tema. " +
      "Responda SOMENTE com um objeto JSON válido, sem texto antes ou depois e sem crases.\n\n" +
      "REGRAS\n- Português do Brasil, texto simples e prático.\n" +
      "- tema: nome curto. problema: 1 ou 2 frases sobre o que se repete.\n" +
      "- casos: códigos JOI dos tickets do tema, usando só códigos que aparecem nos dados. Cite vários casos por tema sempre que houver.\n" +
      "- acoes: 2 a 4 ações para tratar o tema. prevencao: 2 a 4 medidas para evitar novos casos. Cada item termina com \"Responsável sugerido: X\".\n" +
      "- responsavel: áreas envolvidas no tema. prioridade: \"Alta\", \"Média\" ou \"Baixa\", conforme o risco (multa, sanção, exposição de dados, repetição). Ordene do mais prioritário ao menos.\n" +
      "- Não invente fatos além dos dados. Sem CPF, CNPJ de pessoa física ou número de conta.\n\n" +
      "FORMATO\n{\"temas\":[{\"tema\":\"\",\"problema\":\"\",\"casos\":[\"JOI-0\"],\"acoes\":[\"\"],\"prevencao\":[\"\"],\"responsavel\":\"\",\"prioridade\":\"Alta\"}]}\n\n" +
      "CASOS (JSON):\n" + clip(JSON.stringify(src), 90000);
    var raw = await sample.json(prompt, { modelTier: "default" });
    var doc = cleanPlanDoc({ at: Date.now(), n: src.length, temas: raw && raw.temas });
    if (!doc || !doc.temas.length) throw { code: "bad_request", message: "plano consolidado inválido" };
    var ids = {}; CASES.forEach(function (c) { ids[c.id] = 1; });
    doc.temas.forEach(function (t) { t.casos = t.casos.filter(function (id) { return ids[id]; }); });
    await db.doc("meta/plan").set(doc);
    setStatus("Plano consolidado atualizado para todos, com " + doc.temas.length + " temas.");
  });
}
document.getElementById("plan-btn").addEventListener("click", function () {
  active = PLAN; render();
  var t = document.getElementById("tabs");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  t.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
});

/* ---------- Assistente: responde sobre os casos da página ---------- */
var ASK_IDEAS = [
  "Quais casos estão em andamento?",
  "Qual caso tem o prazo mais próximo?",
  "Resuma o último caso finalizado",
  "Quais gaps mais se repetem?",
  "Quais casos são do Simba?",
  "O que foi respondido no JOI-397?",
  "Quais ações evitam novos casos parecidos?"
];
var chat = { open: false, busy: false, history: [] };
var MASCOT_AVATAR = '<svg class="mascot" viewBox="0 0 64 64" aria-hidden="true"><use href="#mascot"/></svg>';

function chatDigest() {
  var read = CASES.filter(function (c) { return c.full; }).sort(function (a, b) { return num(b.id) - num(a.id); });
  var lidos = read.map(function (c, i) {
    var r = c.response;
    if (i >= 10) {
      return {
        id: c.id, time: c.team, titulo: clip(c.title, 120), prazo: c.prazo, situacao: c.stateLabel,
        resumo: r ? clip(r.resumo, 260) : clip((c.ticket || []).join(" "), 260),
        gaps: r ? (r.gaps || []).slice(0, 2).map(function (g) { return clip(g, 110); }) : [],
        envio: r ? clip(r.envio || "", 120) : ""
      };
    }
    var o = {
      id: c.id, time: c.team, titulo: c.title, prazo: c.prazo, statusJira: c.jiraStatus,
      situacao: c.stateLabel, responsavel: c.owner,
      ticket: clip((c.ticket || []).join(" "), 800),
      passoAPasso: (c.steps || []).slice(-14).map(function (s) { return s.when + ": " + clip(s.text, 180); }),
      resposta: null
    };
    if (c.plano) o.plano = { causa: clip(c.plano.causa, 300), acoes: c.plano.acoes.slice(0, 4).map(function (x) { return clip(x, 200); }), prevencao: c.plano.prevencao.slice(0, 3).map(function (x) { return clip(x, 200); }) };
    if (r) {
      o.resposta = {
        titulo: clip(r.title, 200), resumo: clip(r.resumo, 600),
        gaps: (r.gaps || []).map(function (g) { return clip(g, 160); }),
        riscos: (r.riscos || []).map(function (g) { return clip(g, 160); }),
        envio: clip(r.envio || "", 200), desfecho: clip(r.desfecho || "", 240), por: r.by
      };
    }
    return o;
  });
  var sem = CASES.filter(function (c) { return !c.full; }).sort(function (a, b) { return num(b.id) - num(a.id); }).map(function (c) {
    return { id: c.id, titulo: clip(c.title, 110), prazo: c.prazo, tipo: String(c.owner).split(" · ")[0] };
  });
  return clip(JSON.stringify({ casosLidos: lidos, casosSemLeitura: sem, planoConsolidado: PLAN_DOC ? PLAN_DOC.temas.map(function (t) { return { tema: t.tema, prioridade: t.prioridade, casos: t.casos, acoes: t.acoes.map(function (x) { return clip(x, 200); }), prevencao: t.prevencao.map(function (x) { return clip(x, 200); }) }; }) : [] }), 110000);
}
function chatContext() {
  return "Você é o Inspetor Roxinho, assistente do Farol OID, uma página que reúne os casos do canal #operational-intelligence-desk. " +
    "Responda apenas com base nos casos abaixo. Se a informação não estiver neles, diga que não consta. " +
    "Escreva em português do Brasil, em texto simples: sem markdown, sem asteriscos e sem títulos. " +
    "Seja curto (até umas 6 linhas) e cite sempre os códigos JOI dos casos. Para listas use linhas começando com hífen. " +
    "Não invente datas nem números. Hoje é " + new Date().toLocaleDateString("pt-BR") + "; use isso para falar de prazos. " +
    "Em casosSemLeitura há só título e prazo: se a pergunta pedir detalhes deles, diga que ainda não foram lidos e sugira clicar em Atualizar. "+
    "planoConsolidado traz os temas do plano de ação para evitar novos casos, e o campo plano de cada caso traz causa, ações e prevenção sugeridas; ao falar de plano, cite o ticket. "+
    "Os campos de casosLidos: time (OOS, Simba ou LW Suits), situacao (andamento ou finalizado), resposta (encerramento do caso, com gaps e riscos mapeados).\n\n" +
    "CASOS (JSON):\n" + chatDigest();
}
function chatScroll() { var l = document.getElementById("chat-log"); l.scrollTop = l.scrollHeight; }
function addMsg(role, text) {
  var m = document.createElement("div");
  m.className = "msg " + role;
  var t = document.createElement("div");
  t.className = "txt"; t.textContent = text;
  m.appendChild(t);
  var log = document.getElementById("chat-log");
  if (role === "user") { log.appendChild(m); }
  else {
    var row = document.createElement("div");
    row.className = "row";
    row.insertAdjacentHTML("afterbegin", MASCOT_AVATAR);
    row.appendChild(m);
    log.appendChild(row);
  }
  chatScroll();
  return m;
}
function cleanAnswer(s) { return String(s || "").replace(/\*\*/g, "").replace(/^#+\s*/gm, ""); }
function goToCase(id) {
  var c = null;
  CASES.forEach(function (x) { if (x.id === id) c = x; });
  if (!c) return;
  active = c.team; open[c.id] = true;
  document.getElementById("q").value = "";
  render();
  var el = document.querySelector('.case[data-id="' + c.id + '"]');
  if (el) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  }
  if (window.innerWidth <= 640) toggleChat(false);
}
function addCaseLinks(m, text) {
  var ids = [], seen = {};
  (String(text).match(/JOI-\d+/g) || []).forEach(function (id) {
    var ok = CASES.some(function (c) { return c.id === id; });
    if (ok && !seen[id] && ids.length < 4) { seen[id] = 1; ids.push(id); }
  });
  if (!ids.length) return;
  var box = document.createElement("div");
  box.className = "msg-links";
  ids.forEach(function (id) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = "Abrir " + id;
    b.addEventListener("click", function () { goToCase(id); });
    box.appendChild(b);
  });
  m.appendChild(box);
}
function chatErr(e) {
  switch (e && e.code) {
    case "not_granted":
      return "Para responder, o assistente usa o Claude da sua conta e precisa da sua permissão. Envie a pergunta de novo e permita quando o claude.ai perguntar.";
    case "rate_limited":
      return "Muitas perguntas seguidas. Aguarde um instante e tente de novo.";
    default:
      return "Não consegui responder agora. Tente de novo em instantes.";
  }
}
function setChatBusy(b) {
  chat.busy = b;
  document.getElementById("chat-input").disabled = b;
  document.getElementById("chat-send").disabled = b;
  Array.prototype.forEach.call(document.querySelectorAll(".sugg-btn, #chat-more"), function (x) { x.disabled = b; });
}
async function askChat(q) {
  q = String(q || "").trim();
  if (!q || chat.busy || !sample) return;
  setChatBusy(true);
  document.getElementById("chat-sugg").hidden = false;
  document.getElementById("chat-input").value = "";
  addMsg("user", q);
  var bot = addMsg("bot", "Investigando…");
  var txt = bot.firstChild;
  var ctx = chatContext(), input = [], first = true;
  chat.history.slice(-6).forEach(function (t) {
    input.push({ role: "user", content: (first ? ctx + "\n\nPERGUNTA: " : "") + t.q });
    input.push({ role: "assistant", content: t.a });
    first = false;
  });
  input.push({ role: "user", content: (first ? ctx + "\n\nPERGUNTA: " : "") + q });
  try {
    var res = await sample(input, {
      modelTier: "default",
      onText: function (e) { txt.textContent = cleanAnswer(e.text); chatScroll(); }
    });
    var text = cleanAnswer(res && res.text).trim() || "Não consegui montar uma resposta. Tente reformular a pergunta.";
    txt.textContent = text;
    chat.history.push({ q: q, a: text });
    addCaseLinks(bot, text);
  } catch (e) {
    txt.textContent = chatErr(e);
    bot.classList.add("err");
  } finally {
    setChatBusy(false);
    chatScroll();
    if (chat.open) document.getElementById("chat-input").focus();
  }
}
function toggleChat(show) {
  chat.open = typeof show === "boolean" ? show : !chat.open;
  document.getElementById("chat").hidden = !chat.open;
  var fab = document.getElementById("chat-fab");
  fab.setAttribute("aria-expanded", String(chat.open));
  if (chat.open) {
    chatScroll();
    document.getElementById("chat-input").focus();
  } else {
    fab.focus();
  }
}
function addSuggestions(text) {
  var m = addMsg("bot", text);
  m.classList.add("wide");
  var list = document.createElement("div");
  list.className = "sugg-list";
  ASK_IDEAS.forEach(function (q) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "sugg-btn"; b.textContent = q;
    b.disabled = chat.busy;
    b.addEventListener("click", function () { askChat(q); });
    list.appendChild(b);
  });
  m.appendChild(list);
  chatScroll();
}
function initAssistant() {
  if (!sample) return;
  var log = document.getElementById("chat-log");
  if (!log.childNodes.length) addSuggestions("Elementar! Sou o Inspetor Roxinho e investigo os casos que estão aqui no Farol. Escolha uma sugestão ou escreva sua pergunta.");
  document.getElementById("chat-more").addEventListener("click", function () {
    addSuggestions("Aqui vão algumas sugestões:");
  });
  document.getElementById("chat-fab").addEventListener("click", function () { toggleChat(); });
  document.getElementById("chat-close").addEventListener("click", function () { toggleChat(false); });
  document.getElementById("chat-send").addEventListener("click", function () { askChat(document.getElementById("chat-input").value); });
  document.getElementById("chat-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); askChat(this.value); }
  });
  document.getElementById("chat").addEventListener("keydown", function (e) {
    if (e.key === "Escape") toggleChat(false);
  });
  document.getElementById("assistant").hidden = false;
}

(function initRefresh() {
  updateSnap(); render();
  var btn = document.getElementById("refresh");
  btn.insertAdjacentHTML("afterbegin", REFRESH_ICON);
  btn.addEventListener("click", refresh);
  document.getElementById("stop").addEventListener("click", function () {
    stopRequested = true;
    setStatus("Parando depois do caso que está sendo lido…");
  });
  var cl = window.claude;
  if (!cl || typeof cl.use !== "function") {
    disableRefresh();
    setStatus("Para ver os casos compartilhados e atualizar, abra a página no claude.ai.");
    return;
  }
  Promise.all([
    cl.use("db").catch(function () { return null; }),
    cl.use("mcp").catch(function () { return null; }),
    cl.use("sample").catch(function () { return null; }),
    cl.use("user").catch(function () { return null; })
  ]).then(function (r) {
    db = r[0]; mcp = r[1]; sample = r[2];
    initAssistant();
    var user = r[3];
    if (!db) {
      disableRefresh();
      setStatus("Não foi possível abrir os casos compartilhados. Entre no claude.ai e recarregue. Mostrando os casos que vieram com a página.");
      return;
    }
    subscribe();
    if (!mcp) {
      disableRefresh();
      setStatus("A atualização automática não está disponível aqui. Abra a página no claude.ai com Slack e Jira conectados.");
      return;
    }
    if (user && typeof user.can === "function") {
      Promise.resolve(user.can("data.write")).then(function (ok) {
        if (ok === false) {
          canWrite = false;
          disableRefresh();
          setStatus("Seu acesso a esta página é de leitura: você vê todos os casos, mas não atualiza. Peça o nível de Colaborador no compartilhamento.");
        }
      }).catch(function () {});
    }
  });
})();
